name: debugging-policy

on:
  pull_request:
    branches: [main]

jobs:
  verify-debugging-policy:
    name: verify debugging policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify debugging policy and bugfix evidence
        run: bash scripts/verify_debugging_policy.sh
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
